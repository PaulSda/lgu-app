<div id="stage">
  <aside class="pitch" aria-label="À propos du prototype">
    <img class="pitch__logo" id="pitchLogo" alt="Le Guide Ultime">
    <h1 class="pitch__t">L'appli du<br>Guide Ultime</h1>
    <p class="pitch__p">Trouve où manger, du kebab à l'étoilé. Scanne la plaque chez les plaqués, collectionne les 93&nbsp;cartes. Prototype cliquable&nbsp;: les adresses sont des exemples.</p>
    <nav class="pitch__jump" aria-label="Aller à un écran">
      <button data-jump="onb">Accueil</button>
      <button data-jump="map">Explorer</button>
      <button data-jump="search">Recherche</button>
      <button data-jump="stories">Stories rédac</button>
      <button data-jump="group">On mange où ?</button>
      <button data-jump="scan">Scan + verdict</button>
      <button data-jump="potes">Ma bande</button>
      <button data-jump="moi">Profil</button>
      <button data-jump="collec">Ma collec'</button>
      <button data-jump="album">Impression</button>
    </nav>
    <p class="pitch__hand">ouvre-la sur ton tel,<br>c'est encore mieux ↗</p>
  </aside>

  <div id="phone">
    <div id="app">
      <main id="tabs">
        <section class="tab" id="t-map" data-tab="map"></section>
        <section class="tab" id="t-collec" data-tab="collec" hidden></section>
        <section class="tab" id="t-potes" data-tab="potes" hidden></section>
        <section class="tab" id="t-moi" data-tab="moi" hidden></section>
      </main>

      <nav id="nav" aria-label="Navigation principale">
        <button class="nav__b is-on" data-go="map"><svg><use href="#i-map"/></svg><span>J'explore</span></button>
        <button class="nav__b" data-go="potes"><svg><use href="#i-bande"/></svg><span>Ma bande</span></button>
        <button class="nav__scan" data-go="scan" aria-label="Scanner une plaque"><svg><use href="#i-nfc"/></svg><span>Scanner</span></button>
        <button class="nav__b" data-go="collec"><svg><use href="#i-cards"/></svg><span>Ma collec'</span></button>
        <button class="nav__b" data-go="moi"><svg><use href="#i-user"/></svg><span>Moi</span></button>
      </nav>

      <div id="layers"></div>
      <canvas id="confetti" aria-hidden="true"></canvas>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
